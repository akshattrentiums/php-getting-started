name: php ci workflow
on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    # Run on a schedule (UTC). Example below runs every day at 10:10 UTC.
    schedule:
        - cron: '10 10 * * *'
    # Allow manual runs from the Actions UI for testing
    workflow_dispatch:
jobs:
    build:
        runs-on: ubuntu-latest
        name: Run PHP CI workflow
        steps:
            - uses: actions/checkout@v3
            